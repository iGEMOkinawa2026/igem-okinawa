media:
  input: public/media
  output: /media

content:
  - name: activities
    label: Activities / Highlights
    type: collection
    path: src/content/activities
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort:
        - order
        - title
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: title_ja
        label: Title (Japanese)
        type: string
        required: false
      - name: description_ja
        label: Description (Japanese)
        type: text
        required: false
      - name: image
        label: Image
        type: image
        required: false
      - name: imagePlaceholder
        label: Image placeholder (no image)
        type: string
        required: false
      - name: imagePlaceholder_ja
        label: Image placeholder (Japanese)
        type: string
        required: false
      - name: order
        label: Sort order
        type: number
        required: false

  - name: sponsors
    label: Sponsors
    type: collection
    path: src/content/sponsors
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: name
      sort:
        - order
        - name
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: name_ja
        label: Name (Japanese)
        type: string
        required: false
      - name: logo
        label: Logo
        type: image
        required: false
      - name: tier
        label: Tier
        type: select
        required: true
        options:
          values:
            - name: gold
              label: Gold
            - name: silver
              label: Silver
            - name: bronze
              label: Bronze
            - name: partner
              label: Partner
      - name: order
        label: Sort order
        type: number
        required: false

  - name: archive
    label: Archive entries
    type: collection
    path: src/content/archive
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort:
        - year
        - order
      default:
        sort: year
        order: desc
    fields:
      - name: year
        label: Year
        type: number
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: title_ja
        label: Title (Japanese)
        type: string
        required: false
      - name: summary
        label: Summary
        type: text
        required: true
      - name: summary_ja
        label: Summary (Japanese)
        type: text
        required: false
      - name: wiki_url
        label: Wiki URL
        type: string
        required: false
      - name: universities
        label: Universities
        type: text
        required: false
      - name: order
        label: Sort order (within year)
        type: number
        required: false

  - name: news-en
    label: News Articles (English)
    type: collection
    path: src/content/news/en
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      primary: title
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Article title
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
      - name: description
        label: Short description
        type: text
        required: true
      - name: language
        label: Language
        type: select
        required: true
        default: en
        options:
          values:
            - name: en
              label: English
      - name: published
        label: Published
        type: boolean
        required: true
        default: true
      # slug はファイル名（= URL）を決めるために使う。
      # 注意: URL は最終的にファイル名から導出される（src/lib/news.ts の getNewsSlug）。
      # EN と JA は別フォルダ（news/en, news/ja）なので、同じ slug を使っても衝突・上書きは起きない。
      - name: slug
        label: URL slug
        type: string
        required: false
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: category
        label: Category
        type: string
        required: false
      - name: image
        label: Featured image
        type: image
        required: false
      - name: tags
        label: Tags
        type: string
        list: true
        required: false
      - name: body
        label: Article body
        type: rich-text
        required: false
        options:
          format: markdown

  - name: news-ja
    label: News Articles (Japanese)
    type: collection
    path: src/content/news/ja
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      primary: title
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 記事タイトル
        type: string
        required: true
      - name: date
        label: 公開日
        type: date
        required: true
      - name: description
        label: 短い説明
        type: text
        required: true
      - name: language
        label: 言語
        type: select
        required: true
        default: ja
        options:
          values:
            - name: ja
              label: Japanese
      - name: published
        label: 公開する
        type: boolean
        required: true
        default: true
      # slug はファイル名（= URL）を決めるために使う。
      # 注意: URL は最終的にファイル名から導出される（src/lib/news.ts の getNewsSlug）。
      # 英語版と日本語版は別フォルダ（news/en, news/ja）なので、同じ slug でも衝突しない。
      - name: slug
        label: URLスラッグ
        type: string
        required: false
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: category
        label: カテゴリー
        type: string
        required: false
      - name: image
        label: アイキャッチ画像
        type: image
        required: false
      - name: tags
        label: タグ
        type: string
        list: true
        required: false
      - name: body
        label: 本文
        type: rich-text
        required: false
        options:
          format: markdown

  - name: human-practice
    label: Human Practice Sections
    type: collection
    path: src/content/human-practice
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort:
        - order
        - title
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: title_ja
        label: Title (Japanese)
        type: string
        required: false
      - name: description
        label: Description
        type: text
        required: false
      - name: description_ja
        label: Description (Japanese)
        type: text
        required: false
      - name: sectionSlug
        label: URL Slug
        type: string
        required: true
      - name: order
        label: Sort order
        type: number
        required: false

  - name: project
    label: Projects
    type: collection
    path: src/content/project
    format: yaml-frontmatter
    filename: "{year}.md"
    view:
      primary: year
      sort:
        - year
      default:
        sort: year
        order: desc
    fields:
      - name: year
        label: Year
        type: number
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: title_ja
        label: Title (Japanese)
        type: string
        required: false
      - name: summary
        label: Summary
        type: text
        required: true
      - name: summary_ja
        label: Summary (Japanese)
        type: text
        required: false
      - name: description
        label: Description
        type: text
        required: false
      - name: description_ja
        label: Description (Japanese)
        type: text
        required: false
      - name: wiki_url
        label: Wiki URL
        type: string
        required: false
      - name: image
        label: Image
        type: image
        required: false
      - name: story
        label: Story (English) - project page body
        type: object
        required: false
        description: >-
          The body shown on the English project page (/project/). Leave it empty to fall back to
          a simple layout built from Summary and Description. In multi-line fields, every line
          break you type becomes a line break on the page. The layout uses fixed coordinates, so
          adding many lines - or making lines much longer - will overlap the illustrations.
          Keep close to the current length.
        fields:
          - name: intent
            label: Opening line (main heading)
            type: string
            required: false
            description: Shown at the very top. Keep it to one line.
          - name: problem_heading
            label: 1. Problem - heading
            type: string
            required: false
          - name: problem_body
            label: 1. Problem - body
            type: text
            required: false
          - name: but_lead
            label: 2. Turn - lead word
            type: string
            required: false
            description: A short connector such as "But".
          - name: resistance_heading
            label: 2. Turn - heading
            type: string
            required: false
          - name: resistance_body
            label: 2. Turn - body
            type: text
            required: false
          - name: reveal_before
            label: 3. Reveal - text before
            type: string
            required: false
          - name: reveal_word
            label: 3. Reveal - highlighted word
            type: string
            required: false
            description: Shown very large and bold. Keep it short.
          - name: reveal_after
            label: 3. Reveal - text after
            type: string
            required: false
          - name: phage_heading
            label: 4. Solution - heading
            type: string
            required: false
          - name: phage_body
            label: 4. Solution - body
            type: text
            required: false
          - name: weakness_heading
            label: 5. Weakness - heading
            type: text
            required: false
            description: Shown on two lines.
          - name: weakness_body
            label: 5. Weakness - body
            type: text
            required: false
          - name: goal
            label: 6. Goal (centered)
            type: text
            required: false
            description: Centered and large. Three lines works best.
          - name: how_heading
            label: 7. Method - heading
            type: string
            required: false
          - name: how_body
            label: 7. Method - body
            type: text
            required: false
          - name: ai_heading
            label: 8. AI platform - heading
            type: string
            required: false
          - name: ai_body
            label: 8. AI platform - body
            type: text
            required: false
          - name: impact_heading
            label: 9. Lead-in to local challenges
            type: text
            required: false
            description: Introduces the three cards below. Four lines works best.
          - name: cards
            label: 9. Local challenge cards
            type: object
            list: true
            required: false
            description: The challenges listed under the circles. Only the first three are shown.
            fields:
              - name: title
                label: Challenge
                type: string
                required: false
              - name: body
                label: Description
                type: text
                required: false
          - name: closing
            label: 10. Closing line
            type: text
            required: false
            description: The last sentence of the page. Three lines works best.
      - name: story_ja
        label: Story (Japanese) - 日本語プロジェクトページ本文
        type: object
        required: false
        description: >-
          日本語のプロジェクトページ（/ja/project/）に表示される本文です。空欄のままにすると、
          Summary (Japanese) と Description (Japanese) を使った簡易表示に切り替わります。
          複数行の項目は、改行した位置がそのまま画面上の改行になります。デザインの都合で
          行数を大きく増やすとイラストや画像に重なるため、いまの行数を目安にしてください。
        fields:
          - name: intent
            label: 導入の一言（大見出し）
            type: string
            required: false
            description: ページ最上部の見出しです。1行で書いてください。
          - name: problem_heading
            label: ① 課題の見出し
            type: string
            required: false
          - name: problem_body
            label: ① 課題の本文
            type: text
            required: false
          - name: but_lead
            label: ② 転換の一言
            type: string
            required: false
            description: 「しかし、」のような短いつなぎの言葉です。
          - name: resistance_heading
            label: ② 転換の見出し
            type: string
            required: false
          - name: resistance_body
            label: ② 転換の本文
            type: text
            required: false
          - name: reveal_before
            label: ③ 中央の一言（前）
            type: string
            required: false
          - name: reveal_word
            label: ③ 中央の強調語
            type: string
            required: false
            description: 大きな太字で表示されます。短くしてください。
          - name: reveal_after
            label: ③ 中央の一言（後）
            type: string
            required: false
          - name: phage_heading
            label: ④ 解決策の見出し
            type: string
            required: false
          - name: phage_body
            label: ④ 解決策の本文
            type: text
            required: false
          - name: weakness_heading
            label: ⑤ 弱点の見出し
            type: text
            required: false
            description: 2行で表示されます。
          - name: weakness_body
            label: ⑤ 弱点の本文
            type: text
            required: false
          - name: goal
            label: ⑥ 目標（中央）
            type: text
            required: false
            description: 中央揃えで大きく表示されます。3行が目安です。
          - name: how_heading
            label: ⑦ 手法の見出し
            type: string
            required: false
          - name: how_body
            label: ⑦ 手法の本文
            type: text
            required: false
          - name: ai_heading
            label: ⑧ AI 活用の見出し
            type: string
            required: false
          - name: ai_body
            label: ⑧ AI 活用の本文
            type: text
            required: false
          - name: impact_heading
            label: ⑨ 地域課題への導入文
            type: text
            required: false
            description: 直後の課題カード3枚の導入になる文です。4行が目安です。
          - name: cards
            label: ⑨ 地域課題のカード
            type: object
            list: true
            required: false
            description: 丸いイラストの下に並ぶ課題の紹介です。表示されるのは先頭3件までです。
            fields:
              - name: title
                label: 課題名
                type: string
                required: false
              - name: body
                label: 説明
                type: text
                required: false
          - name: closing
            label: ⑩ 締めの一文
            type: text
            required: false
            description: ページ最後の文です。3行が目安です。

  - name: members
